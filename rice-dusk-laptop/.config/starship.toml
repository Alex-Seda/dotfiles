# Pastel Dusk - Starship Prompt

palette = 'pastel_dusk'

[palettes.pastel_dusk]
primary = "#BFA2F0"      # purple
secondary = "#8FB8F0"    # blue
tertiary = "#F2A7C8"     # pink
green = "#A8E0B8"        # mint
surface = "#3B3657"
text_light = "#E6E1F2"
text_muted = "#A59FBF"
bg_dark = "#1E1B2B"
warn = "#F0D89A"
error = "#F0788E"

# Minimal prompt character
[character]
success_symbol = "[❯](bold primary)"
error_symbol = "[❯](bold error)"
vicmd_symbol = "[❮](bold secondary)"

# Directory - purple, minimal path
[directory]
style = "bold primary"
read_only = " 󰌾"
read_only_style = "tertiary"
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "

# Git branch - Subtle accent
[git_branch]
symbol = " "
style = "secondary"
format = "[$symbol$branch]($style) "

# Git status - Minimalist indicators
[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "[!${count}](error)"
modified = "[~${count}](warn)"
staged = "[+${count}](green)"
untracked = "[?${count}](text_muted)"
style = "text_muted"
format = "([$all_status$ahead_behind]($style))"

# Command duration - Show only if > 2 seconds
[cmd_duration]
min_time = 2000
style = "italic warn"
format = "[ $duration]($style) "

# Package version (minimal)
[package]
symbol = "󰏗 "
style = "tertiary"
format = "[$symbol$version]($style) "
disabled = false

# Username (subtle)
[username]
style_user = "text_light"
style_root = "bold error"
format = "[$user]($style) "
show_always = false

# Hostname (only show if SSH)
[hostname]
ssh_only = true
style = "text_muted"
format = "[@$hostname]($style) "

# Line break for cleaner prompt
[line_break]
disabled = false

# Programming language contexts (minimal)
[nodejs]
symbol = " "
style = "secondary"
format = "[$symbol($version)]($style) "

[python]
symbol = " "
style = "primary"
format = '[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style) '

[rust]
symbol = " "
style = "tertiary"
format = "[$symbol($version)]($style) "

[golang]
symbol = " "
style = "secondary"
format = "[$symbol($version)]($style) "

[docker_context]
symbol = " "
style = "text_muted"
format = "[$symbol$context]($style) "
disabled = false
