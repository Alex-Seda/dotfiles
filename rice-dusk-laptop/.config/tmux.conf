# Pastel Dusk - Tmux Configuration

# === GENERAL SETTINGS ===
# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# Increase scrollback buffer
set -g history-limit 10000

# Renumber windows on close
set -g renumber-windows on

# Enable true color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# === KEYBINDINGS ===
# Prefix remains default (Ctrl-b) or uncomment to change
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# === PASTEL DUSK THEME ===

# Pane borders
set -g pane-border-style fg='#4A4470'
set -g pane-active-border-style fg='#BFA2F0'

# Status bar
set -g status-style bg='#1E1B2B',fg='#E6E1F2'
set -g status-position top
set -g status-justify left
set -g status-left-length 50
set -g status-right-length 100

# Status left: Session name
set -g status-left "#[fg=#171520,bg=#BFA2F0,bold] #S #[fg=#BFA2F0,bg=#2A2640] #[default]"

# Status right: Git branch, path, time
set -g status-right "#[fg=#8FB8F0]#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null) #[fg=#A59FBF] #(echo '#{pane_current_path}' | sed 's#$HOME#~#') #[fg=#BFA2F0,bg=#2A2640] #[fg=#171520,bg=#BFA2F0,bold] %H:%M "

# Window status format
set -g window-status-format "#[fg=#A59FBF,bg=#2A2640] #I:#W "
set -g window-status-current-format "#[fg=#171520,bg=#F2A7C8,bold] #I:#W "

# Message styling
set -g message-style bg='#BFA2F0',fg='#171520',bold
set -g message-command-style bg='#8FB8F0',fg='#171520'

# Pane number display
set -g display-panes-active-colour '#BFA2F0'
set -g display-panes-colour '#4A4470'

# Clock mode
setw -g clock-mode-colour '#BFA2F0'

# === ACTIVITY MONITORING ===
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style fg='#F0D89A',bg='#2A2640'
