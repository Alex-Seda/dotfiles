# Forest pastel Minimalist Rice - Starship Prompt

palette = 'forest'

[palettes.forest]
forest_primary = "#B8D99F"
forest_secondary = "#8FC5A0"
forest_dark = "#425542"
earth_warm = "#C5A77E"
text_light = "#F0F3E6"
text_muted = "#B6C4B2"
bg_dark = "#101810"
warn = "#E5C178"
error = "#E58F82"

# Minimal prompt character
[character]
success_symbol = "[❯](bold forest_primary)"
error_symbol = "[❯](bold error)"
vicmd_symbol = "[❮](bold forest_secondary)"

# Directory - soft forest green, minimal path
[directory]
style = "bold forest_primary"
read_only = " 󰌾"
read_only_style = "earth_warm"
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "

# Git branch - Subtle accent
[git_branch]
symbol = " "
style = "forest_secondary"
format = "[$symbol$branch]($style) "

# Git status - Minimalist indicators
[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "[!${count}](error)"
modified = "[~${count}](warn)"
staged = "[+${count}](forest_primary)"
untracked = "[?${count}](text_muted)"
style = "text_muted"
format = "([$all_status$ahead_behind]($style))"

# Command duration - Show only if > 2 seconds
[cmd_duration]
min_time = 2000
style = "italic warn"
format = "[ $duration]($style) "

# Package version (minimal)
[package]
symbol = "󰏗 "
style = "earth_warm"
format = "[$symbol$version]($style) "
disabled = false

# Username (subtle)
[username]
style_user = "text_light"
style_root = "bold error"
format = "[$user]($style) "
show_always = false

# Hostname (only show if SSH)
[hostname]
ssh_only = true
style = "text_muted"
format = "[@$hostname]($style) "

# Line break for cleaner prompt
[line_break]
disabled = false

# Programming language contexts (minimal)
[nodejs]
symbol = " "
style = "forest_secondary"
format = "[$symbol($version)]($style) "

[python]
symbol = " "
style = "forest_primary"
format = '[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style) '

[rust]
symbol = " "
style = "earth_warm"
format = "[$symbol($version)]($style) "

[golang]
symbol = " "
style = "forest_secondary"
format = "[$symbol($version)]($style) "

[docker_context]
symbol = " "
style = "text_muted"
format = "[$symbol$context]($style) "
disabled = false
