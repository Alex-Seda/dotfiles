# Forest pastel Minimalist Rice - Tmux Configuration

# === GENERAL SETTINGS ===
# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# Increase scrollback buffer
set -g history-limit 10000

# Renumber windows on close
set -g renumber-windows on

# Enable true color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# === KEYBINDINGS ===
# Prefix remains default (Ctrl-b) or uncomment to change
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# === FOREST PASTEL THEME ===

# Pane borders
set -g pane-border-style fg='#425542'
set -g pane-active-border-style fg='#B8D99F'

# Status bar
set -g status-style bg='#101810',fg='#F0F3E6'
set -g status-position top
set -g status-justify left
set -g status-left-length 50
set -g status-right-length 100

# Status left: Session name
set -g status-left "#[fg=#101810,bg=#B8D99F,bold] #S #[fg=#B8D99F,bg=#182619] #[default]"

# Status right: Git branch, path, time
set -g status-right "#[fg=#8FC5A0]#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null) #[fg=#B6C4B2] #(echo '#{pane_current_path}' | sed 's#$HOME#~#') #[fg=#B8D99F,bg=#182619] #[fg=#101810,bg=#B8D99F,bold] %H:%M "

# Window status format
set -g window-status-format "#[fg=#B6C4B2,bg=#182619] #I:#W "
set -g window-status-current-format "#[fg=#101810,bg=#8FC5A0,bold] #I:#W "

# Message styling
set -g message-style bg='#B8D99F',fg='#101810',bold
set -g message-command-style bg='#8FC5A0',fg='#101810'

# Pane number display
set -g display-panes-active-colour '#B8D99F'
set -g display-panes-colour '#425542'

# Clock mode
setw -g clock-mode-colour '#B8D99F'

# === ACTIVITY MONITORING ===
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style fg='#E5C178',bg='#182619'
