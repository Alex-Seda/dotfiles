# Background
image {
    monitor =
    path = /home/aseda/Pictures/wallpaper/boba-fett.jpg
    blur_size = 0
    blur_passes = 0
    zindex = 0
    size = 1080 # Pixel width of smaller side. Got from 'hyprctl monitors'
    rounding = 0
}

# Password Input
input-field {
    monitor =
    size = 250, 50
    position = 0, -20
    zindex = 10
}

# Date Label
label {
    monitor =
    zindex=5
    text = cmd[update:1000] echo -e "$(LC_TIME=en_US.UTF-8 date +"%A, %B %d")"
    color = rgba(0, 0, 0, 0.90)
    font_size = 25
    font_family = SF Pro Display Semibold
    position = 0, 350
    halign = center
    valign = center
}

# Time Label
label {
    monitor =
    zindex = 5
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(0, 0, 0, 0.90)
    font_size = 120
    font_family = SF Pro Display Bold
    position = 0, 230
    halign = center
    valign = center
}
