# Arctic-blue Minimalist Rice - Tmux Configuration

# === GENERAL SETTINGS ===
# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# Increase scrollback buffer
set -g history-limit 10000

# Renumber windows on close
set -g renumber-windows on

# Enable true color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# === KEYBINDINGS ===
# Prefix remains default (Ctrl-b) or uncomment to change
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# === ARCTIC-BLUE THEME ===

# Pane borders
set -g pane-border-style fg='#2A3F4F'
set -g pane-active-border-style fg='#6DD3CE'

# Status bar
set -g status-style bg='#0C1821',fg='#E8F4F2'
set -g status-position top
set -g status-justify left
set -g status-left-length 50
set -g status-right-length 100

# Status left: Session name
set -g status-left "#[fg=#0C1821,bg=#6DD3CE,bold] #S #[fg=#6DD3CE,bg=#1A2530] #[default]"

# Status right: Git branch, path, time
set -g status-right "#[fg=#4FACB0]#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null) #[fg=#9BAFB8] #(echo '#{pane_current_path}' | sed 's#$HOME#~#') #[fg=#6DD3CE,bg=#1A2530] #[fg=#0C1821,bg=#6DD3CE,bold] %H:%M "

# Window status format
set -g window-status-format "#[fg=#9BAFB8,bg=#1A2530] #I:#W "
set -g window-status-current-format "#[fg=#0C1821,bg=#4FACB0,bold] #I:#W "

# Message styling
set -g message-style bg='#6DD3CE',fg='#0C1821',bold
set -g message-command-style bg='#4FACB0',fg='#0C1821'

# Pane number display
set -g display-panes-active-colour '#6DD3CE'
set -g display-panes-colour '#2A3F4F'

# Clock mode
setw -g clock-mode-colour '#6DD3CE'

# === ACTIVITY MONITORING ===
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style fg='#FFA559',bg='#1A2530'
