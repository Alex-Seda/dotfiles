# Arctic-blue Minimalist Rice - Starship Prompt

palette = 'arctic'

[palettes.arctic]
# Arctic Blue Theme
arctic_primary = "#6DD3CE"
arctic_secondary = "#4FACB0"
arctic_dark = "#2A3F4F"
earth_warm = "#C98474"
text_light = "#E8F4F2"
text_muted = "#9BAFB8"
bg_dark = "#0C1821"
warn = "#FFA559"
error = "#FF6B6B"

# Minimal prompt character
[character]
success_symbol = "[❯](bold arctic_primary)"
error_symbol = "[❯](bold error)"
vicmd_symbol = "[❮](bold arctic_secondary)"

# Directory - Arctic blue, minimal path
[directory]
style = "bold arctic_primary"
read_only = " 󰌾"
read_only_style = "earth_warm"
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "

# Git branch - Subtle accent
[git_branch]
symbol = " "
style = "arctic_secondary"
format = "[$symbol$branch]($style) "

# Git status - Minimalist indicators
[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "[!${count}](error)"
modified = "[~${count}](warn)"
staged = "[+${count}](arctic_primary)"
untracked = "[?${count}](text_muted)"
style = "text_muted"
format = "([$all_status$ahead_behind]($style))"

# Command duration - Show only if > 2 seconds
[cmd_duration]
min_time = 2000
style = "italic warn"
format = "[ $duration]($style) "

# Package version (minimal)
[package]
symbol = "󰏗 "
style = "earth_warm"
format = "[$symbol$version]($style) "
disabled = false

# Username (subtle)
[username]
style_user = "text_light"
style_root = "bold error"
format = "[$user]($style) "
show_always = false

# Hostname (only show if SSH)
[hostname]
ssh_only = true
style = "text_muted"
format = "[@$hostname]($style) "

# Line break for cleaner prompt
[line_break]
disabled = false

# Programming language contexts (minimal)
[nodejs]
symbol = " "
style = "arctic_secondary"
format = "[$symbol($version)]($style) "

[python]
symbol = " "
style = "arctic_primary"
format = '[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style) '

[rust]
symbol = " "
style = "earth_warm"
format = "[$symbol($version)]($style) "

[golang]
symbol = " "
style = "arctic_secondary"
format = "[$symbol($version)]($style) "

[docker_context]
symbol = " "
style = "text_muted"
format = "[$symbol$context]($style) "
disabled = false
